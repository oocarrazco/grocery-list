
<div class="mb-6">
  <!-- <h1 class="display-6 mb-6 text-center" style="color: #1a3c6e;">Family Grocery List</h1> -->

  <!-- Create/Rename List Form -->
  <form (ngSubmit)="saveList()" class="d-flex gap-2 mb-4 align-items-center">
    <input type="text" [(ngModel)]="listName" name="listName" class="form-control" placeholder="Enter list name" required />
    <button type="submit" class="btn btn-primary">
      {{ isEditing ? 'Save' : 'Create' }}
    </button>
    <button *ngIf="isEditing" type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
  </form>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <!-- Lists Table -->
  <div class="bg-white rounded shadow mb-4">
    <h2 class="p-3 border-bottom text-center" style="color: #1a3c6e;">Grocery List</h2>
    <div class="p-4 border-bottom fw-bold text-center d-flex">
      <div class="flex-grow-1 text-start">List Name</div>
      <div class="w-25">Actions</div>
    </div>
    <div *ngFor="let list of groceryLists" class="p-4 border-bottom last:border-bottom-0 text-center d-flex align-items-center">
      <div class="flex-grow-1 text-start">{{ list.name }}</div>
      <div class="w-25">
        <div class="d-flex flex-wrap gap-2 justify-content-center">
          <button class="btn btn-sm btn-primary" (click)="editList(list)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteList(list)">Delete</button>
          <button class="btn btn-sm btn-outline-secondary" (click)="selectListForItems(list)">Items</button>
        </div>
      </div>
    </div>
    <div *ngIf="groceryLists.length === 0" class="p-4 text-center text-muted">
      No lists found. Create your first grocery list!
    </div>
  </div>

  <!-- Item Management UI (shown only when a list is selected for items) -->
  <div *ngIf="selectedList && !isEditing" class="mt-4">
    <h2 class="p-3 border-bottom text-center" style="color: #1a3c6e;">Items for: {{ selectedList.name }}</h2>
    <app-add-item
      [newItem]="itemToEdit || { name: '', quantity: 1, isPurchased: false }"
      [editMode]="itemEditMode"
      (add)="addItem($event)"
      (edit)="editItemSubmit($event)"
    ></app-add-item>
  <app-item-list [groceryItems]="selectedList.items" (edit)="startEditItem($event)" (delete)="deleteItem($event)" (toggle)="toggleItem($event)"></app-item-list>
    <button class="btn btn-secondary mt-2" (click)="cancelEdit()">Back to Lists</button>
  </div>
</div>
