services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: grocery_list_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      - "1433:1433"      
    healthcheck:
      test: CMD-SHELL bash -c '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -Q "SELECT 1"'
      interval: 15s
      timeout: 5s
      start_period: 100s
      retries: 10

  backend:
    build:
      context: ./GroceryList-RESTAPI
      dockerfile: Dockerfile
    container_name: grocerylist-backend    
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=grocery_list_db;User=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
    ports:
      - "5003:5003"
    working_dir: /app
    depends_on:
      - db

  frontend:
    build:
      context: ./GroceryList-FRONTEND
      dockerfile: Dockerfile
    container_name: grocerylist-frontend    
    ports:
      - "4200:4200"
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true 
    depends_on:
      - backend